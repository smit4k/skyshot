[package]
name = "skyshot"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Browserless Bluesky post renderer"
readme = "README.md"

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "skyshot"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
cli = ["dep:clap", "dep:iana-time-zone", "dep:reqwest"]
wasm = ["dep:wasm-bindgen", "dep:serde-wasm-bindgen", "dep:js-sys"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = { version = "0.10", features = ["serde"] }
cosmic-text = { version = "0.19", default-features = false, features = ["std", "swash"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
svgtypes = "0.15"
tiny-skia = { version = "0.11", default-features = false, features = ["std"] }
unicode-segmentation = "1"
unicode-script = "0.5"
unicode-properties = { version = "0.1", default-features = false, features = ["emoji"] }
url = "2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
clap = { version = "4", features = ["derive"], optional = true }
iana-time-zone = { version = "0.1", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { version = "0.3", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
