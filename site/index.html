<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Turn Bluesky posts and profiles into PNGs in your browser.">
    <meta name="color-scheme" content="light dark">
    <title>Skyshot — Bluesky posts and profiles to PNG</title>
    <script>
      if (!location.pathname.endsWith('/') && !location.pathname.endsWith('/index.html')) {
        location.replace(`${location.pathname}/${location.search}${location.hash}`);
      }
    </script>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="./style.css">
    <script type="module" src="./app.mjs"></script>
  </head>
  <body>
    <main>
      <header>
        <h1>Skyshot</h1>
        <p>Turn <a href="https://bsky.app">Bluesky</a> posts and profiles into PNGs.</p>
      </header>

      <form>
        <label for="bluesky-link">Post or profile link</label>
        <div class="input-row">
          <input id="bluesky-link" name="link" type="url" placeholder="https://bsky.app/profile/…" required maxlength="2048" autocomplete="off" spellcheck="false" aria-describedby="status">
          <button type="submit">Generate <span aria-hidden="true">→</span></button>
        </div>
        <fieldset id="themes">
          <legend>Image theme</legend>
          <div class="theme-options">
            <label class="theme-choice light"><input type="radio" name="theme" value="light" checked> Light</label>
            <label class="theme-choice dim"><input type="radio" name="theme" value="dim"> Dim</label>
            <label class="theme-choice dark"><input type="radio" name="theme" value="dark"> Dark</label>
          </div>
        </fieldset>
      </form>

      <p id="status" role="status" aria-live="polite"></p>
      <noscript><p>Enable JavaScript to render a post or profile in your browser.</p></noscript>

      <div id="output" aria-busy="false">
        <p id="placeholder">Your image will appear here.</p>
        <figure>
          <img id="preview" alt="Rendered Bluesky image" hidden>
          <figcaption>
            <a id="download" download="skyshot.png" hidden>Download PNG <span aria-hidden="true">↓</span></a>
            <span><a href="https://github.com/smit4k/skyshot">Source</a> · <a href="https://smitp.cc/">smitp.cc/</a></span>
          </figcaption>
        </figure>
      </div>
    </main>
  </body>
</html>
